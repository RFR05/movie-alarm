<style>

:root{
  --room:#17121C;      /* 암막: 바탕 */
  --stall:#231B2B;     /* 객석: 올라온 면 */
  --edge:#3B2E47;      /* 통로 경계선 */
  --velvet:#56283A;    /* 벨벳: 빈 좌석 */
  --lamp:#FFB23E;      /* 통로등: 고른 것 */
  --lamp-ink:#2B1B00;
  --screen:#EAF1FF;    /* 스크린 빛: 본문 글자 */
  --dust:#A99DB5;      /* 보조 글자 */
  --exit:#3FD08F;      /* 비상구: 자리 있음 */
  --alarm:#FF7A7A;     /* 매진 */
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --bar-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--room);color:var(--screen);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body{min-height:100vh;padding:0 16px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-family:"Board",var(--font);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}

/* ── 머리 ── */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.asof{font-size:12px;color:var(--dust);white-space:nowrap}
.asof .num{color:var(--lamp);font-size:15px;margin-left:4px}
.asof.old .num{color:var(--alarm)}
.tabs{display:flex;border-bottom:1px solid var(--edge);margin:0 -16px;padding:0 16px;position:sticky;top:0;background:var(--room);z-index:5}
.tab{flex:1;padding:11px 4px 10px;text-align:center;color:var(--dust);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--screen);border-bottom-color:var(--lamp)}
.tab .count{font-family:"Board",var(--font);font-weight:900;color:var(--lamp);margin-left:5px}

/* ── 고르기 ── */
.label{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 9px;font-size:13px;font-weight:600;color:var(--dust)}
.label small{font-weight:400;font-size:12px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--edge);border-radius:999px;white-space:nowrap;color:var(--screen)}
.chip[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);font-weight:700}
.day{flex:none;width:52px;padding:7px 0 6px;border:1px solid var(--edge);border-radius:10px;text-align:center;position:relative}
.day .dow{display:block;font-size:12px;color:var(--dust)}
.day .dow.sat{color:#8FB4FF}.day .dow.sun{color:var(--alarm)}
.day .num{display:block;font-size:23px;line-height:1.15}
.day .tag{display:block;font-size:10px;color:var(--dust);height:14px}
.day[aria-pressed="true"]{border-color:var(--lamp);background:rgba(255,178,62,.1)}
.day[aria-pressed="true"] .num{color:var(--lamp)}
.day.has::after,.movie.has .title::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--lamp)}
.day.has::after{top:5px;right:5px}

.movies{display:flex;flex-direction:column}
.movie{display:flex;align-items:center;gap:12px;padding:8px 0 8px 10px;border-left:3px solid transparent;border-bottom:1px solid var(--edge);width:100%}
.movie:last-child{border-bottom:0}
.movie[aria-pressed="true"]{border-left-color:var(--lamp);background:linear-gradient(90deg,rgba(255,178,62,.09),transparent 70%)}
.poster{flex:none;width:38px;height:54px;border-radius:4px;background:var(--stall);object-fit:cover;display:grid;place-items:center;color:var(--dust);font-weight:700;overflow:hidden}
.movie .title{flex:1;font-weight:600;line-height:1.35;position:relative}
.movie.has .title::after{position:static;display:inline-block;margin-left:7px;vertical-align:middle}
.movie .meta{flex:none;font-size:12px;color:var(--dust);padding-right:2px}

.shows{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.show{position:relative;padding:10px 12px 11px;border:1px solid var(--edge);border-radius:12px 12px 4px 4px;background:var(--stall);min-width:0}
.show .time{font-size:28px;line-height:1.05;display:block}
.show .end{font-size:11px;color:var(--dust);margin-left:5px;font-family:var(--font);font-weight:400}
.show .hall{display:block;font-size:12px;color:var(--dust);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .left{display:block;font-size:13px;margin-top:2px}
.show .left .num{font-size:16px}
.show .left.full{color:var(--alarm);font-weight:700}
.show .left small{display:block;font-weight:400;font-size:11px;color:var(--dust)}
.show .left.few{color:var(--lamp)}
.show[aria-pressed="true"]{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp)}
.show[aria-pressed="true"] .time{color:var(--lamp)}
.show[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--lamp);font-weight:800}

.picked{display:flex;flex-direction:column;gap:6px}
.pick-row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;background:var(--stall);border-radius:8px;font-size:13px;line-height:1.4}
.pick-row b{font-weight:600}
.pick-row .when{color:var(--dust);display:block}
.pick-row .when .num{color:var(--screen);font-size:15px}
.pick-row .x{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;color:var(--dust);text-align:center;font-size:18px;line-height:32px}

.cond{background:var(--stall);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.row + .row{margin-top:8px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);text-align:center;font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35}
.stepper .num{width:38px;text-align:center;font-size:26px;color:var(--lamp)}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--edge);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--screen);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--lamp)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--lamp-ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.mode{padding:10px 4px;text-align:center;font-weight:600;color:var(--dust);border-left:1px solid var(--edge)}
.mode:first-child{border-left:0}
.mode[aria-checked="true"]{background:var(--lamp);color:var(--lamp-ink)}
.mode:disabled{opacity:.4}
.hint{margin:10px 2px 0;font-size:13px;color:var(--dust)}

/* ── 상영관 배치도 ── */
.seatmap{margin-top:16px;padding:18px 0 12px;border-radius:12px;background:radial-gradient(120% 70% at 50% 0,rgba(234,241,255,.13),transparent 62%),#1C1522;overflow:hidden}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 4px;font-size:12px;color:var(--dust)}
.map-head .name{flex:1 1 100%}
.map-head .tools{display:flex;gap:6px;margin-left:auto}
.tool{padding:6px 11px;border:1px solid var(--edge);border-radius:999px;font-size:12px;color:var(--screen);white-space:nowrap}
.scroller{overflow:auto;padding:0 12px 4px;-webkit-overflow-scrolling:touch}
.stage{position:relative;margin:0 auto}
.beam{height:16px;margin:10px 9% 4px;border-radius:50%/100% 100% 0 0;background:linear-gradient(180deg,var(--screen),rgba(234,241,255,.15));box-shadow:0 14px 34px 4px rgba(234,241,255,.22);animation:beam .7s ease-out both}
.beam-label{text-align:center;font-size:11px;color:var(--dust);margin-bottom:14px}
@keyframes beam{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
.grid{position:relative}
.seat,.rowname{position:absolute;left:calc(var(--x) * var(--p));top:calc(var(--y) * var(--p))}
.seat{width:calc(var(--w) * var(--p) - var(--gap));height:calc(var(--p) - var(--gap));border-radius:34% 34% 18% 18%;background:var(--velvet);font-size:10px;line-height:calc(var(--p) - var(--gap));text-align:center;color:rgba(234,241,255,.55);transition:background .16s,box-shadow .16s;overflow:hidden}
.seat.lit{background:var(--lamp);color:var(--lamp-ink);box-shadow:0 0 calc(var(--p) * .3) rgba(255,178,62,.55);font-weight:700}
.seat.dis{background:none;border:1px dashed var(--edge);pointer-events:none}
.rowname{width:var(--p);height:calc(var(--p) - var(--gap));line-height:calc(var(--p) - var(--gap));font-size:min(11px,calc(var(--p) * .78));color:var(--dust);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 12px 0;font-size:12px;color:var(--dust)}
.legend i{display:inline-block;width:13px;height:12px;border-radius:34% 34% 18% 18%;vertical-align:-1px;margin-right:5px;background:var(--velvet)}
.legend i.lit{background:var(--lamp)}.legend i.dis{background:none;border:1px dashed var(--edge)}
.seat-sum{padding:10px 12px 0;font-size:13px}
.seat-sum .num{color:var(--lamp);font-size:16px}

/* ── 내 감시 / 관심 영화 ── */
.watch{padding:14px 0;border-bottom:1px solid var(--edge);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start}
.watch h3{margin:0;font-size:15px;font-weight:700;line-height:1.35}
.watch p{margin:0;font-size:13px;color:var(--dust);grid-column:1}
.watch p .num{color:var(--screen);font-size:15px}
.watch .state{font-size:12px;font-weight:700;color:var(--dust)}
.watch .state.ok{color:var(--exit)}
.watch .del{grid-column:2;grid-row:1 / span 3;align-self:center;padding:8px 12px;border:1px solid var(--edge);border-radius:999px;font-size:13px}
.watch.gone h3,.watch.gone p{text-decoration:line-through;opacity:.5}
.watch.gone .del{border-color:var(--alarm);color:var(--alarm)}
.watch.wait .state{color:var(--lamp)}
.note{margin:14px 0 0;font-size:13px;color:var(--dust)}
.empty{padding:40px 8px;text-align:center;color:var(--dust)}
.empty b{display:block;color:var(--screen);font-size:16px;margin-bottom:6px}
.empty .tool{display:inline-block;margin-top:14px;padding:9px 16px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 14px;border:1px solid var(--edge);border-radius:999px}
.tag-chip.fixed{padding-right:14px;color:var(--dust)}
.tag-chip.new{border-color:var(--lamp);color:var(--lamp)}
.tag-chip.gone{text-decoration:line-through;opacity:.5}
.tag-chip button{width:28px;height:28px;border-radius:50%;text-align:center;color:var(--dust);font-size:16px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--edge);border-radius:10px;background:var(--stall);font-size:16px}
.addrow input::placeholder{color:var(--dust)}
.addrow button{padding:0 16px;border-radius:10px;background:var(--edge);font-weight:700}
.suggest{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 2px;border-bottom:1px solid var(--edge)}
.suggest span:last-child{color:var(--lamp);font-weight:700;flex:none}

/* ── 아래 보내기 막대 ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--stall);border-top:1px solid var(--edge)}
.bar .what{flex:1;font-size:13px;color:var(--dust);line-height:1.35}
.bar .what b{color:var(--screen);display:block;font-size:14px}
.bar .go{flex:none;padding:12px 20px;border-radius:12px;background:var(--lamp);color:var(--lamp-ink);font-weight:800}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));z-index:20;padding:12px 14px;border-radius:10px;background:var(--screen);color:#1B1422;font-size:14px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,7,13,.72);display:flex;align-items:flex-end}
.sheet > div{width:100%;max-height:92vh;overflow:auto;background:var(--stall);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet ol{margin:8px 0 12px;padding-left:20px;color:var(--dust);font-size:14px}
.sheet textarea{width:100%;height:110px;padding:10px;border:1px solid var(--edge);border-radius:10px;background:var(--room);color:var(--screen);font:12px/1.4 ui-monospace,Menlo,monospace;resize:none}
.sheet .btns{display:flex;gap:8px;margin-top:12px}
.sheet .btns button{flex:1;padding:12px;border-radius:12px;text-align:center;font-weight:700;border:1px solid var(--edge)}
.sheet .btns .go{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){body{max-width:520px;margin:0 auto}.tabs{margin:0;padding:0}.strip{margin:0;padding-left:0;padding-right:0}.bar{left:50%;right:auto;width:520px;transform:translateX(-50%)}}
</style>
</head>
<body>
<header class="top">
  <h1>영화 알리미</h1>
  <span class="asof" id="asof"></span>
</header>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="main"><div class="empty"><b>시간표를 불러오는 중</b>잠깐만 기다려 주세요.</div></main>
<div class="bar" id="bar" hidden></div>
<noscript><p style="padding:24px">이 화면은 자바스크립트가 켜져 있어야 보여요.</p></noscript>

<script>
(() => {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tg = null, inTg = false;     // 텔레그램 안에서 열렸는지 (아래 맨 끝에서 텔레그램 스크립트를 불러온 뒤 정해짐)
const WEEK = ['일','월','화','수','목','금','토'];
const CODE = '#감시';
const store = {
  get(k, d) { try { const v = localStorage.getItem('ma:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ma:' + k, JSON.stringify(v)); } catch (e) {} },
};

/* 데이터가 있는 곳: 깃허브 저장소의 data 브랜치 (주소에 ?data=... 를 주면 그걸 씀) */
const DATA = (() => {
  const q = new URLSearchParams(location.search).get('data');
  if (q) return q.replace(/\/?$/, '/');
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/data/` : './data/';
})();

const S = {
  tab: 'pick', loading: true, error: null,
  cat: null, wl: {watches: [], movies: [], fixed: [], max: 20}, layouts: null, disCount: {},
  shows: [], byId: new Map(),
  b: null, d: null, m: null,
  picked: new Map(),            // 고른 회차: id → 회차
  n: 1, adj: true, mode: 'any',
  hallKey: null, seats: new Set(), zoom: false,
  dels: new Set(), mvAdd: [], mvDel: new Set(),
};

/* ── 날짜·글자 도우미 ── */
const pad = n => String(n).padStart(2, '0');
const ymd = dt => `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}`;
const toDate = d => new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
const TODAY = ymd(new Date());
const TOMORROW = ymd(new Date(Date.now() + 864e5));
const dayText = d => `${+d.slice(4, 6)}/${+d.slice(6, 8)}(${WEEK[toDate(d).getDay()]})`;
const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const num = v => `<span class="num">${esc(v)}</span>`;
const hallKeyOf = sh => (sh.hn ? `${sh.b}|${sh.hn}` : '');
const branchName = no => ((S.cat && S.cat.branches.find(b => b.no === no)) || {}).name || '';
const movieOf = no => (S.cat && S.cat.movies[no]) || {};
function seatsText(ids, layout, limit) {
  const pos = new Map(layout.seats.map(s => [s[0] + s[1], s]));
  const list = ids.map(id => pos.get(id)).filter(Boolean).sort((a, b) => a[3] - b[3] || a[2] - b[2]);
  const rows = new Map();
  for (const s of list.slice(0, limit || 24)) (rows.get(s[0]) || rows.set(s[0], []).get(s[0])).push(s[1]);
  const extra = list.length - (limit || 24);
  return [...rows].map(([r, ns]) => `${r}열 ${ns.join('·')}`).join(' / ') + (extra > 0 ? ` 외 ${extra}석` : '');
}

/* ── '좋은 자리' 구역 (alarm/seats.py 의 zone_ids 와 같은 규칙) ──
   가운데 절반 폭 + 줄 수의 45%~85% 지점(중간~뒤쪽). 좌석 = [줄, 번호, x, y, 폭, 장애인석] */
function zoneIds(seats) {
  const out = new Set();
  if (!seats.length) return out;
  const ys = new Map();
  for (const s of seats) if (!ys.has(s[0]) || s[3] < ys.get(s[0])) ys.set(s[0], s[3]);
  const rows = [...ys.keys()].sort((a, b) => ys.get(a) - ys.get(b) || (a < b ? -1 : a > b ? 1 : 0));
  const n = rows.length, halfUp = v => Math.floor(v + 0.5);
  const good = new Set(n <= 2 ? rows : n <= 4 ? rows.slice(Math.floor((n + 1) / 2))
    : rows.slice(halfUp((n - 1) * 0.45), halfUp((n - 1) * 0.85) + 1));
  let x0 = Infinity, x1 = -Infinity;
  for (const s of seats) { x0 = Math.min(x0, s[2]); x1 = Math.max(x1, s[2] + s[4]); }
  const center = (x0 + x1) / 2, half = (x1 - x0) / 2;
  for (const s of seats) if (good.has(s[0]) && !s[5] && Math.abs(s[2] + s[4] / 2 - center) <= half * 0.5 + 1e-9) out.add(s[0] + s[1]);
  return out;
}
window.__zoneIds = zoneIds;   // 테스트에서 파이썬 쪽 규칙과 같은지 맞춰 볼 때 씀

/* ── 불러오기 ── */
async function getJSON(name) {
  const r = await fetch(`${DATA}${name}?t=${Math.floor(Date.now() / 60000)}`, {cache: 'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`${name} ${r.status}`);
  return r.json();
}
async function load() {
  S.loading = true; S.error = null; render();
  try {
    const [cat, wl, lays] = await Promise.all([getJSON('catalog.json'), getJSON('watchlist.json'), getJSON('layouts.json').catch(() => null)]);
    S.cat = cat;
    S.layouts = lays || {};
    S.disCount = {};
    for (const k in S.layouts) S.disCount[k] = S.layouts[k].seats.filter(s => s[5]).length;
    if (wl) S.wl = Object.assign({watches: [], movies: [], fixed: [], max: 20}, wl);
    S.shows = cat ? cat.shows.map(r => ({id: String(r[0]), b: r[1], d: r[2], m: r[3], t: r[4], e: r[5], hall: r[6], hn: r[7], kind: r[8], rest: r[9], tot: r[10]}))
      .filter(x => x.d > TODAY || (x.d === TODAY && x.t > `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`)) : [];
    S.byId = new Map(S.shows.map(x => [x.id, x]));
    if (cat && cat.branches.length) {
      const last = store.get('branch');
      S.b = (cat.branches.find(b => b.no === last) || cat.branches[0]).no;
      pickFirstDay();
    }
  } catch (e) {
    S.error = e;
  }
  S.loading = false; render();
}

/* ── 고르기 상태 ── */
const daysOf = b => [...new Set(S.shows.filter(x => x.b === b).map(x => x.d))].sort();
function pickFirstDay() {
  const days = daysOf(S.b);
  S.d = days.includes(S.d) ? S.d : (days[0] || null);
  S.m = null;
}
const moviesOf = (b, d) => {
  const m = new Map();
  for (const x of S.shows) if (x.b === b && x.d === d) m.set(x.m, (m.get(x.m) || 0) + 1);
  return [...m].map(([no, count]) => ({no, count, name: movieOf(no).n || '제목 없음', poster: movieOf(no).p}))
    .sort((a, b2) => b2.count - a.count || a.name.localeCompare(b2.name, 'ko'));
};
function hallsOfPicked() { return [...new Set([...S.picked.values()].map(hallKeyOf))]; }
function layoutNow() { return (S.layouts && S.hallKey && S.layouts[S.hallKey]) || null; }
function syncHall() {
  const halls = hallsOfPicked();
  const one = halls.length === 1 && halls[0] ? halls[0] : null;
  const shown = one || halls.find(h => h && S.layouts && S.layouts[h]) || null;   // 여러 관이면 첫 번째 관을 보여줌
  if (shown !== S.hallKey) { S.hallKey = shown; S.seats = new Set(); S.zoom = false; }
  if (S.mode === 'pick' && !(one && layoutNow())) S.mode = 'zone';
  if (S.mode === 'pick' && !S.seats.size && layoutNow()) S.seats = zoneIds(layoutNow().seats);
}
const canPick = () => { const h = hallsOfPicked(); return h.length === 1 && !!h[0] && !!layoutNow(); };
function litIds() {
  const lay = layoutNow();
  if (!lay) return new Set();
  if (S.mode === 'pick') return S.seats;
  if (S.mode === 'zone') return zoneIds(lay.seats);
  return new Set(lay.seats.filter(s => !s[5]).map(s => s[0] + s[1]));
}

function changes() {

    if (S.mode === 'pick') it.seats = [...S.seats].sort();
    p.add = [it];
    parts.push(`감시 추가 ${ids.length}건`);
  }
  if (S.dels.size) { p.del = [...S.dels]; parts.push(`감시 삭제 ${S.dels.size}건`); }
  if (S.mvAdd.length) p['mv+'] = S.mvAdd.slice();
  if (S.mvDel.size) p['mv-'] = [...S.mvDel];
  if (S.mvAdd.length + S.mvDel.size) parts.push(`관심 영화 변경 ${S.mvAdd.length + S.mvDel.size}건`);
  return {p, parts};
}
function condText() {
  const base = S.mode === 'any' ? '아무 자리' : S.mode === 'zone' ? '좋은 자리' : `지정 좌석 ${S.seats.size}곳 중`;
  return `${base} ${S.n}석${S.n >= 2 && S.adj ? ' 연석' : ''}`;
}
function renderBar() {
  const bar = $('#bar'), {parts} = changes();
  bar.hidden = !parts.length;
  if (parts.length) {
    bar.innerHTML = `<span class="what"><b>${esc(parts.join(', '))}</b>${S.picked.size ? esc(condText()) : '보내면 5분 안에 텔레그램으로 확인 답장이 와요'}</span>
      <button class="go" data-act="send">보내기</button>`;
  }
  document.documentElement.style.setProperty('--bar-h', parts.length ? `${bar.offsetHeight}px` : '0px');
}
function toast(msg) {
  $$('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function send() {
  const {p} = changes();
  if (S.picked.size && S.mode === 'pick') {
    if (!S.seats.size) return toast('배치도에서 좌석을 하나 이상 골라 주세요.');
    if (S.seats.size < S.n) return toast(`고른 좌석이 인원(${S.n}명)보다 적어요.`);
  }
  if (S.wl.watches.length - S.dels.size + S.picked.size > S.wl.max)
    return toast(`감시는 ${S.wl.max}개까지예요. 회차를 줄이거나 안 쓰는 감시를 지워 주세요.`);
  const json = JSON.stringify(p);
  if (new TextEncoder().encode(json).length > 3800) return toast('한 번에 보내기엔 너무 많아요. 회차나 좌석을 줄여서 나눠 보내 주세요.');
  store.set('pending', {ts: Date.now(), adds: [...S.picked.values()].map(x => ({show: x.id, mn: movieOf(x.m).n || '', bn: branchName(x.b), d: x.d, t: x.t, hall: x.hall, cond: condText()}))});
  window.__lastPayload = json;
  if (inTg && tg.sendData) {
    try { tg.sendData(json); } catch (e) {}
    setTimeout(() => codeSheet(json, true), 1800);   // 정상이면 그 전에 화면이 닫힘
  } else codeSheet(json, false);
}
function codeSheet(json, wasTg) {
  $$('.sheet').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div role="dialog" aria-label="코드로 보내기"><h2>${wasTg ? '자동으로 보내지지 않았어요' : '텔레그램 봇에게 코드로 보내기'}</h2>
    <p class="note" style="margin:0">${wasTg ? '채팅방 아래의 🎬 버튼으로 연 화면이 아니면 자동 전송이 안 돼요. 아래 코드를 대신 보내 주세요.' : '이 화면을 텔레그램 밖에서 열어서 자동으로 보낼 수 없어요.'}</p>
    <ol><li>아래 코드를 복사해요.</li><li>텔레그램에서 내 알리미 봇 채팅방에 붙여넣고 보내요.</li><li>5분 안에 확인 답장이 와요.</li></ol>
    <textarea readonly id="code">${esc(CODE + ' ' + json)}</textarea>
    <div class="btns"><button data-act="closesheet">닫기</button><button class="go" data-act="copy">코드 복사</button></div></div>`;
  document.body.appendChild(el);
}

/* ── 눌렀을 때 ── */
const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const ACT = {
  tab(v) { S.tab = v; window.scrollTo(0, 0); },
  reload() { load(); return false; },
  branch(v) { S.b = v; store.set('branch', v); pickFirstDay(); },
  day(v) { S.d = v; S.m = null; },
  movie(v) { S.m = S.m === v ? null : v; },
  show(v) {
    if (S.picked.has(v)) S.picked.delete(v); else S.picked.set(v, S.byId.get(v));
    syncHall();
  },
  unpick(v) { S.picked.delete(v); syncHall(); },
  n(v) { S.n = Math.max(1, Math.min(8, S.n + +v)); },
  adj() { S.adj = !S.adj; },
  mode(v) { S.mode = v; if (v === 'pick' && !S.seats.size && layoutNow()) S.seats = zoneIds(layoutNow().seats); },
  zoom() { S.zoom = !S.zoom; S.center = S.zoom; },
  zonefill() { S.seats = zoneIds(layoutNow().seats); },
  clear() { S.seats = new Set(); },
  del(v) { S.dels.has(v) ? S.dels.delete(v) : S.dels.add(v); },
  mvadd(v) { addMovie(v); },
  mvundo(v) { S.mvAdd = S.mvAdd.filter(m => m !== v); },
  mvdel(v) { S.mvDel.has(v) ? S.mvDel.delete(v) : S.mvDel.add(v); },
  send() { send(); return false; },
  closesheet() { $$('.sheet').forEach(el => el.remove()); return false; },
  copy() {
    const ta = $('#code');
    const done = () => toast('복사했어요. 봇 채팅방에 붙여넣어 보내 주세요.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
    else { ta.select(); document.execCommand('copy'); done(); }
    return false;
  },
};
function addMovie(name) {
  name = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (!name) return;
  const have = [...(S.wl.movies || []), ...(S.wl.fixed || []), ...S.mvAdd].map(norm);
  if (have.includes(norm(name))) return toast('이미 관심 영화에 있어요.');
  S.mvAdd.push(name);
}
document.addEventListener('click', e => {
  const seat = e.target.closest('.seat'), grid = e.target.closest('#grid');
  if (grid && S.mode === 'pick') return tapSeat(e, seat, grid);
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  haptic();
  if (ACT[el.dataset.act](el.dataset.v) !== false) render();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'mvform') return;
  e.preventDefault();
  addMovie($('#mvinput').value);
  render();
  const input = $('#mvinput'); if (input) input.focus();
});
/* 좌석이 작게 보일 때도 잘 눌리게: 누른 곳에서 가장 가까운 좌석을 고름 */
function tapSeat(e, seat, grid) {
  if (!seat || seat.classList.contains('dis')) {
    const r = grid.getBoundingClientRect(), p = parseFloat(grid.style.getPropertyValue('--p'));
    let best = null, bd = 0.85 * p;
    for (const el of $$('.seat:not(.dis)', grid)) {
      const b = el.getBoundingClientRect();
      const d = Math.hypot(b.left + b.width / 2 - e.clientX, b.top + b.height / 2 - e.clientY);
      if (d < bd) { bd = d; best = el; }
    }
    seat = best;
    if (!seat || r.width === 0) return;
  }
  const id = seat.dataset.seat, on = !S.seats.has(id);
  on ? S.seats.add(id) : S.seats.delete(id);
  seat.classList.toggle('lit', on);
  seat.setAttribute('aria-pressed', on);
  haptic();
  const lay = layoutNow();
  $('#seatsum').innerHTML = S.seats.size ? `고른 좌석 ${num(S.seats.size)}개 <span style="color:var(--dust)">${esc(seatsText([...S.seats], lay, 20))}</span>` : '좌석을 눌러서 골라 주세요.';
  renderBar();
}
window.addEventListener('resize', fitHall);
/* 포스터 그림이 안 열리면 제목 첫 글자로 대신함 */
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || !img.matches || !img.matches('img.poster')) return;
  const span = document.createElement('span');
  span.className = 'poster'; span.textContent = img.dataset.letter || '';
  img.replaceWith(span);
}, true);

/* 텔레그램 스크립트는 화면을 막지 않게 따로 불러옴. 2.5초 안에 안 오면(텔레그램 밖) 그냥 시작 */
let started = false;
const start = () => { if (!started) { started = true; load(); } };
function tgReady() {
  tg = (window.Telegram && window.Telegram.WebApp) || null;
  inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#17121C'); tg.setBackgroundColor && tg.setBackgroundColor('#17121C'); } catch (e) {}
  }
  start();
}
const sdk = document.createElement('script');
sdk.src = 'https://telegram.org/js/telegram-web-app.js';
sdk.onload = tgReady;
sdk.onerror = start;
document.head.appendChild(sdk);
setTimeout(start, 2500);
})();
</script>
</body>
