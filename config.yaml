# ─────────────────────────────────────────────
#  영화 알리미 기본 설정
#  평소엔 건드릴 필요 없어요. 영화·회차·자리는 텔레그램의 선택 화면에서 골라요.
#  (바꾸려면: GitHub에서 이 파일 열고 연필 아이콘 → 수정 → Commit changes)
# ─────────────────────────────────────────────

megabox:
  # 선택 화면에 나올 지점 (이름 일부). '대구'라고 쓰면 이름에 대구가 들어간 지점 전부.
  # 다른 지역도 보고 싶으면 줄을 추가:  - 구미
  branches:
    - 대구

  # 확인할 메가박스 이벤트 페이지
  event_pages:
    - /event/movie
    - /event

# 영화 상관없이 무조건 알려줄 이벤트 단어 (이벤트 제목에 들어 있으면 알림)
event_keywords:
  - 아트그라피
  - 아트그래피
  - ARTGRAPHY

# 관심 영화의 이벤트(오리지널 티켓, 포스터 증정 등)도 알릴지
event_include_movies: true

# 관심 영화 (새 날짜 예매 오픈 + 특전 이벤트 알림).
# 보통은 선택 화면의 '관심 영화' 탭에서 넣고 빼면 되고, 여기 적은 건 항상 유지돼요.
movies: []

# ── 아래는 세부 조정 (그대로 둬도 됨) ──
catalog_minutes: 20      # 선택 화면의 시간표를 몇 분마다 새로 받을지
days_ahead: 14           # 사이트가 날짜 목록을 안 줄 때 며칠 뒤까지 볼지
checks_per_run: 3        # 자리 감시가 있을 때, 한 번 실행에서 몇 번 확인할지 (1~6)
check_interval_sec: 70   # 그 확인 사이 간격(초)
# page_url: ""           # 선택 화면 주소를 직접 정하고 싶을 때만 (기본: https://내아이디.github.io/저장소이름/)
